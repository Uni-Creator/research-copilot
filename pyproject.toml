[project]
name = "research-copilot"
version = "0.1.0"
description = "Multi-agent research copilot: research question -> cited literature review"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langgraph>=0.3",
    "markdown>=3.5",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pymupdf>=1.24",
    "pytest>=8.0",
    "python-dotenv>=1.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]   # FastAPI Depends()/Header() in defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B011"]

[project]
name = "research-copilot"
version = "0.1.0"
description = "Multi-agent research copilot: research question -> cited literature review"
requires-python = ">=3.10"
dependencies = [
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]   # FastAPI Depends()/Header() in defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B011"]
